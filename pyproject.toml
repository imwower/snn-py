[build-system]
requires = ["setuptools>=67"]
build-backend = "setuptools.build_meta"

[project]
name = "snn-py"
version = "0.1.0"
description = "SNN tooling playground"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "snn-py" }]

[project.scripts]
snnpy-demo = "snn_py.cli.demo:main"
snnpy-doctor = "snn_py.cli.doctor:main"
snnpy-replay = "snn_py.cli.replay:main"
snnpy-sweep = "snn_py.cli.sweep:main"
